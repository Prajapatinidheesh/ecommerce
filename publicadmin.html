<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>
</head>
<body>

<h1>Admin Panel</h1>

<input id="name"
placeholder="Product Name">

<input id="price"
placeholder="Price">

<button onclick="addProduct()">
Add Product
</button>

<script>

async function addProduct(){

  const name =
  document.getElementById("name").value;

  const price =
  document.getElementById("price").value;

  await fetch("/api/products",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      name,
      price
    })
  });

  alert("Product Added");
}

</script>

</body>
</html>
