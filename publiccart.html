<!DOCTYPE html>
<html>
<head>
  <title>Cart</title>
</head>
<body>

<h1>Your Cart</h1>

<ul id="cart"></ul>

<button onclick="checkout()">
Checkout
</button>

<script>

let cart =
JSON.parse(localStorage.getItem("cart"))
|| [];

const cartList =
document.getElementById("cart");

cart.forEach(item => {
  cartList.innerHTML += `
    <li>
      ${item.name}
      - ₹${item.price}
    </li>
  `;
});

function checkout() {
  alert("Order Placed!");
  localStorage.removeItem("cart");
  location.reload();
}

</script>

</body>
</html>
